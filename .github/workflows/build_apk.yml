name: Build Trade Shield Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - "trade_shield_pro_flutter_ready.zip"
      - ".github/workflows/build_apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o trade_shield_pro_flutter_ready.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        working-directory: extracted/trade_shield_pro
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: extracted/trade_shield_pro
        run: flutter pub get

      - name: Build APK
        working-directory: extracted/trade_shield_pro
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trade-shield-pro-apk
          path: extracted/trade_shield_pro/build/app/outputs/flutter-apk/app-release.apk
